; CarbonMWVisuals 1.0.1 - settings
[Main]
; 1 = CarbonMWVisuals on, 0 = off: nothing is loaded or patched, the game runs as vanilla Carbon
Enabled=1
; 1 = MW day / Carbon night cycle (24 hours), 0 = MW daytime only (the sun moves back and forth
; between [TimeOfDay] MinHour and MaxHour)
Mode=1
; 1 = in-game and the menus/garage share one time: the menus/garage continue from the in-game
; time and the other way round. Only the time: speed, mode, StopClock and weather stay separate
; ([TimeOfDay] / [FrontEndTimeOfDay]). Needs [FrontEndTimeOfDay] Enable=1. Also in the F12 menu (Global)
SyncTime=1

[Shadows]
; 1 = dynamic MW style sun shadows (Carbon's own shadow map, disabled by EA, switched back on).
; Also in the F12 menu (Global tab: on/off right away, quality); its Save writes Enable and Size here
Enable=1
; shadow strength 0..1 (1 = only ambient light in shadow)
Strength=0.9
; also darken ambient light inside shadows (0..1) for crisper MW style shadows
Darkness=0
; PCF radius in texels: small = sharp shadow edges, large = soft
Softness=1.0
; shadow map size (quality) for all shadows, world and cars: 1024 (Carbon original), 2048,
; 4096 (sharpest, heaviest). A new size is used after restarting the game
Size=4096
; half width of the shadowed area, in metres. Smaller = sharper, but distant shadows disappear
Range=90
; move the shadowed area ahead of the camera (0 = centred on the camera, 0.4 = 40% of Range ahead)
Forward=0.4
; 1 = few casters (large objects only), 2 = all casters (heavier)
Detail=2
; 1 = GPUs Carbon does not recognise (e.g. Intel) use a D24S8 depth texture when supported
ForceHW=1
; shadow map format: 0 = automatic (Carbon's choice), 1 = D24S8 (hardware compare),
; 2 = INTZ/DF16 (depth value, compared in the shader)
Format=0
; casters: 0 = all scenery (default), 1 = only objects flagged "cast shadow" in the track data (original filter)
Casters=0
; 1 = cars are drawn into the shadow map from the side facing the sun (solid car shadows), 0 = original Carbon behaviour
CarFrontFaces=1

[Sun]
; direction TO the sun (x, y, z; z = up). Empty = use mwSunDirection from the fx files (0.35, 0.45, 0.82).
; When set, it is used by every port shader and by the shadows. Small z = low sun = longer shadows.
; Example of a lower sun (~37 degrees):  Direction=0.45, 0.55, 0.55
Direction= -0.000, 0.017, 1.000

[TimeOfDay]
; NFS Most Wanted style time of day (in-game only): the sun moves across the sky and the lighting
; blends between MW's own midday and low-sun (morning/evening) data. At night ([Main] Mode=1) everything
; fades to Carbon's own night look: shading, baked lights, headlight beams and the original visual
; treatment (blue LUT, bloom); world lights come back, sun shadows fade out. The fx values are the noon look:
; at 12:00 with Overcast=0 everything looks exactly like the fx files / [Sun] Direction.
; The menus/garage (FE) keep the fx and [FrontEndFx] values.
; The F12 menu ([Menu]) changes all of these in-game; its Save button writes them back here.
; time when the game starts (hours: 6 = sunrise, 12 = noon, 18 = sunset). The menu saves its current time here
StartHour=11.50
; real seconds per in-game hour. MW = 100 ([Main] Mode=1: a full day in 40 minutes; Mode=0: one sweep
; from MinHour to MaxHour in ~18 minutes).
; 0 = the time stands still at StartHour
HourLength=70.1
; real seconds per in-game hour while the sun is down (0 = same as HourLength)
NightHourLength=0.0
; 1 = the clock is stopped at StartHour (menu: "Stop the clock")
StopClock=0
; [Main] Mode=0 only: like MW, the time moves back and forth between these hours (MW: 6.6 and 17.4,
; sun ~7 degrees high). Allowed range 6.1 .. 17.9
MinHour=6.60
MaxHour=17.40
; MW weather blend: 0 = clear, 1 = fully overcast (dark sun, flat grey light, thicker haze)
Overcast=0.00
; extra haze towards a low sun (morning/evening): 0 = none, 1 = MW's full low-sun haze increase
; (with these noon values it washes distant objects out towards the sun). Default 0.35
SunsetHaze=0.35
; car headlight beams on the road (all cars) and the AI beam/glow sprites switch on and off by
; the clock (HH:MM). In between they follow the [Lights] settings / the fx values
HeadlightsOn=18:04
HeadlightsOff=06:04

[Lights]
; world light glows/flares (street lamps, buildings, neon, etc.). Car lights are not affected.
; 0 = off, 1 = original Carbon
WorldFlares=0
; flare types that stay visible when WorldFlares=0 (comma list, 0..31; empty = none).
; 16, 18, 29 = road hazard/warning lights. To find another type: DebugMode=1 + FlareSoloKey (see [Debug])
WorldFlaresKeep=16,18,29
; textured headlight beams on the road in front of AI/traffic/police cars: 0 = off, 1 = original Carbon
HeadlightBeams=0
; fixed-shape light pool (HEADLIGHTGLOW sprite) on the road in front of nearby AI cars:
; 0 = off, 1 = original Carbon
HeadlightGlow=0
; 1 = at night ([Main] Mode=1) all world lights fade in, and between [TimeOfDay] HeadlightsOn
; and HeadlightsOff the AI headlight beams/glow come back like original Carbon; the three settings
; above then only apply in daytime. 0 = never
NightLights=1

[FrontEnd]
; Settings for the menus/garage (FE) ONLY. In-game always uses the values in the fx files.
; 1 = enabled (FE uses the values below), 0 = FE looks exactly like in-game
Enable=1
; 1 = MW daytime shaders like in-game, 0 = original Carbon lighting (values in between are allowed)
WorldDayBlend=1.0
CarDayBlend=1.0
VTDayBlend=1.0
; car reflections in the FE use the original NFS Most Wanted garage cubemaps (scripts\CarbonMWVisuals_FEEnv\*.dds)
; 1 = enabled, 0 = original Carbon cubemap (also switchable in the F12 menu)
MWEnvMap=0
; set to use: empty = follow the Carbon garage (QRACE/CAREER/CSHOP/CARLOT), or one of those names
;   QRACE = MW main menu junkyard, CAREER = MW safehouse garage, CSHOP = customisation shop, CARLOT = car lot
MWEnvMapSet=

[FrontEndTimeOfDay]
; Time of day in the menus/garage (FE), with its own clock. The FE look ([FrontEnd] / [FrontEndFx])
; is the noon look here, like the fx values are in-game. Same keys as [TimeOfDay]; the noon sun is
; shared ([Sun] Direction). The F12 menu has a "Menus / garage" tab for all of these.
; 1 = on, 0 = off (the FE uses the [FrontEnd] / [FrontEndFx] values as they are)
Enable=1
; 1 = MW day / Carbon night cycle (24 hours), 0 = MW daytime only (between MinHour and MaxHour)
Mode=1
; FE time when the game starts (hours)
StartHour=11.50
; 1 = the FE clock is stopped at StartHour
StopClock=0
; real seconds per FE hour (0 = the time stands still)
HourLength=100.0
; real seconds per FE hour while the sun is down (0 = same as HourLength)
NightHourLength=0.0
; Mode=0 only (6.1 .. 17.9)
MinHour=6.60
MaxHour=17.40
; MW weather blend: 0 = clear, 1 = fully overcast
Overcast=0.00
; extra haze towards a low sun: 0 = none, 1 = MW's full low-sun haze increase
SunsetHaze=0.35

[FrontEndFx]
; Every port shader parameter, used ONLY in the FE. The initial values are exactly the in-game values
; (taken from the current fx files), so the FE starts out looking the same. Change them as you like.
;   name=value            -> applies to every fx file that has this parameter
;   file.name=value       -> applies to one file only (e.g. car.mwCarGlassEnvScale)
;   1 number = float, 3-4 numbers = colour/vector. Put ; in front = use the in-game value.
;
; --- world.fx (buildings & world objects); also used by: worldreflect, worldnormalmap, worldprelit, sky, car, carnormalmap, glassreflectshader
mwDiffuseColour=0.62, 0.57, 0.48, 1.0
mwAmbientColour=0.36, 0.38, 0.42, 1.0
; ~ (0.27,0.45,0.94) * 3.97e-4
mwBetaRayleigh=0.000107, 0.000179, 0.000373
; ~ (0.19,0.25,0.38) * 2.1e-4
mwBetaMie=0.000040, 0.000052, 0.000079
; MW convention: negative g = glow towards the sun
mwMieG=-0.50
mwInscatterIntensity=8.1
; MW FOGVALUE (distance * scale, clamped to 2500)
mwFogDistanceScale=1.0
mwInscatterTint=1.0, 1.0, 1.0
; 0 = exactly MW (no extinction on the sun), 1 = the sun dims too
mwSunExtinction=0.0
; 0 = drop the night light colours, 1 = use Carbon vertex colours as they are
mwBakedLightMix=0.0
; how strongly the vertex colour luminance is used as AO
mwBakedAOStrength=0.5
; luminance gain before it becomes AO
mwBakedAOScale=2.0
; car headlight beams (player + AI) in daytime: 0 = off, 1 = like at night
mwHeadlightScale=0.0
; 0 = MW scattering only, 1 = add Carbon fog on top
mwCarbonFogMix=0.0
;
; --- worldreflect.fx (roads)
; planar road reflection in daytime (cars & buildings):
mwRoadReflectScale=0
;
; --- worldprelit.fx (prelit objects)
; prelit without normals: average sun share
mwPrelitSunFactor=0.6
;
; --- sky.fx (sky)
mwSkyZenithColour=0.30, 0.48, 0.76, 1.0
; yellowish haze typical of MW
mwSkyHorizonColour=0.82, 0.80, 0.72, 1.0
mwSkyGradientPower=0.45
; 0 = gradient only, 1 = MW scattering only
mwSkyScatterMix=0.35
; atmosphere distance (units) for sky scattering
mwSkyDistZenith=8000.0
mwSkyDistHorizon=40000.0
mwSkyBrightness=1.0
mwSunGlowColour=1.00, 0.86, 0.62, 1.0
mwSunGlowPower=10.0
mwSunGlowIntensity=0.35
mwSunDiskColour=1.00, 0.96, 0.85, 1.0
; cosine of the disk angle
mwSunDiskSize=0.9994
mwSunDiskIntensity=3.0
mwCloudOpacity=1.0
mwCloudBrightness=1.15
mwCloudHorizonFade=0.12
;
; --- car.fx (cars); also used by: carnormalmap
; sun strength on paint diffuse
mwCarSunScale=0.9
; ambient from above (sky)
mwCarSkyScale=1.0
; ambient from below (road bounce)
mwCarGroundScale=0.6
; sun specular highlight strength
mwCarSunSpecScale=0.5
; rig fill lights (night street lights) in daytime
mwCarFillScale=0
; 1 = car sun direction = world sun (same as the shadows), 0 = Carbon car light rig (changes per region)
mwCarWorldSun=1.0
; cubemap reflection strength in daytime, head-on (1 = like at night)
mwCarEnvScale=1
; cubemap reflection at grazing angles (Fresnel). Head-on stays mwCarEnvScale
mwCarEnvRimScale=1
; 0 = reflection tinted by the paint (Carbon), 1 = clear/neutral (clearcoat)
mwCarEnvNeutral=0.6
; 0 = sun highlight tinted by the paint (Carbon), 1 = white (clearcoat)
mwCarSpecWhite=0
; reduce paint (diffuse) saturation in daytime, 0 = original
mwCarDiffuseDesat=0.15
; light glass reflection in daytime, head-on (replaces mwCarEnvScale)
car.mwCarGlassEnvScale=0.1
carnormalmap.mwCarGlassEnvScale=0.25
; light glass reflection at grazing angles (replaces mwCarEnvRimScale)
car.mwCarGlassRimScale=0.15
carnormalmap.mwCarGlassRimScale=0.5
;
; --- carnormalmap.fx (normal-mapped car parts)
; sun highlight strength on light glass (x mwCarSunSpecScale)
mwCarGlassSpecScale=0.8
;
; --- visualtreatment.fx (colour grading)
; original colour share } desaturation: c*Colour + luma*Luma
mwVTDesatColour=0.85
; luminance share       } (sum of 1 = same brightness)
mwVTDesatLuma=0.15
; linear contrast around the pivot
mwVTContrast=1.12
mwVTPivot=0.45
; 0 = linear, 1 = full S-curve (smoothstep)
mwVTCurve=0.35
; warm yellow-green tint typical of MW
mwVTTint=1.06, 1.03, 0.86
mwVTBrightness=1.1
; Carbon bloom multiplier in daytime
mwVTBloomScale=0.5
; 1 = disable Carbon's per-zone desaturation in daytime
mwVTKillCarbonDesat=1.0

[Menu]
; in-game overlay to change the time of day, reflection and shadow settings with the mouse
; (Save writes them to this file)
; 1 = available, 0 = off
Enable=1
; key that shows/hides the menu (same formats as the [Debug] keys)
Key=F12

[Debug]
; Troubleshooting tools. Leave at 0 for normal play.
; 1 = enable the hotkeys below, extra logging in CarbonMWVisuals.log and mwCarGlassDebug in car.fx
DebugMode=0
; Hotkeys (only active with DebugMode=1). Accepted formats: F1..F24, A..Z, 0..9, NUMPAD0..NUMPAD9,
; INSERT, DELETE, HOME, END, PAGEUP, PAGEDOWN, PAUSE, SCROLLLOCK, TAB, SPACE, BACKSPACE,
; or a virtual-key code (e.g. 0x72 or 114). NONE = no key.
; re-read [FrontEnd], [FrontEndFx] and WorldFlares from this file without restarting
ReloadKey=F3
; cycle the shadow debug view (off / shadow map position / raw value / 4 m world checkerboard)
ShadowDebugViewKey=F9
; shadows on/off
ShadowToggleKey=F10
; write shadow diagnostics to CarbonMWVisuals.log
DiagnosticsKey=F6
; cycle through the world light types currently on screen, showing only one type at a time
; (logged as "SOLO type N"); press again past the last type to go back to normal
FlareSoloKey=F8
; number of initial in-game frames logged in detail
LogFrames=3
